name: trust_hire_app
description: "A new Flutter project."


publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0



#-------PACKAGES----------#


dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.12.4

  #-------UTILITY PACKAGES----------#

  #ICONS
  iconsax: ^0.0.8
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  intl: ^0.18.1
  logger: ^2.0.1
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  app_links: ^6.4.0

  #STATE MANAGEMENT
  get: ^4.6.5
  get_storage: ^2.1.1

  #-------PUSH NOTIFICATIONS (FCM)----------#
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

  #OTHERS
  google_fonts: ^8.1.0
  smooth_page_indicator: ^2.0.1


  #-------PACKAGES END----------#

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0

  # Tooling to generate the app launcher icon (see tool/generate_app_icon.dart).
  image: ^4.3.0
  flutter_launcher_icons: ^0.14.4


#-------APP LAUNCHER ICON----------#
# Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/images/LogoImages/app_icon.png"
  android: true
  adaptive_icon_background: "#1E2A60"
  adaptive_icon_foreground: "assets/images/LogoImages/app_icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/LogoImages/app_icon.png"
    background_color: "#1E2A60"
    theme_color: "#1E2A60"
  windows:
    generate: true
    image_path: "assets/images/LogoImages/app_icon.png"


flutter:
  uses-material-design: true

 #--------LOCAL ASSETS-------
  assets:
    - assets/images/
    - assets/images/OnBoardingImages/image1.png
    - assets/images/OnBoardingImages/image2.png
    - assets/images/OnBoardingImages/image3.png
    - assets/images/LogoImages/facebooklLogo.png
    - assets/images/LogoImages/googleLogo.png
    - assets/images/LogoImages/AppLogo.png
    - assets/images/burnedout_images/balance.png.png
    - assets/images/burnedout_images/exhausted.png.png
    - assets/images/burnedout_images/motivation.png.png
    - assets/images/burnedout_images/overall.png.png
    - assets/images/burnedout_images/sleep.png.png
    - assets/images/burnedout_images/stress.png.png
    - assets/images/burnedout_images/team.png.png
    - assets/images/GuideImages/remote_work_guide.png




  #--------LOCAL ASSETS-------

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Black.ttf
        - asset: assets/fonts/Poppins-BlackItalic.ttf
          style: italic
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-BoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 300
        - asset: assets/fonts/Poppins-ThinItalic.ttf
          weight: 300
          style: italic




